# Inclus dans le bloc http de nginx:alpine (conf.d/*.conf).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cache long uniquement pour les assets hashés par Vite ; le reste ne doit pas être mis en cache.
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control $cache_control always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # API + WebSocket (/api/ws) : les en-têtes Upgrade sont obligatoires pour le handshake.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # SPA : toute route inconnue renvoie index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
